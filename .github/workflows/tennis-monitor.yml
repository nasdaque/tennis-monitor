name: Tennis Court Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: Tennis-xiao-east
      STATE_PATH: state/state.json
      TZ: Europe/London

    steps:
      - uses: actions/checkout@v4

      - name: Debug - show files
        run: |
          pwd
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright with force
        run: |
          python -m playwright install --force --with-deps chromium

      - name: Create state directory
        run: mkdir -p state

      - name: Run monitor
        run: python monitor_tennis.py

      - name: Restore cache (optional)
        uses: actions/cache@v4
        with:
          path: state
          key: tennis-state-${{ github.run_id }}
