name: Tennis Court Monitor

on:
  schedule:
    - cron: "*/15 * * * *"   
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: Tennis-xiao-east
      STATE_PATH: state/state.json
      TZ: Europe/London
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure state directory exists
        run: mkdir -p state

      - name: Set date key (Europe/London)
        id: date
        run: |
          echo "today=$(TZ=Europe/London date +%F)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state cache (per day)
        uses: actions/cache@v4
        with:
          path: state
          key: tennis-state-${{ steps.date.outputs.today }}
          restore-keys: |
            tennis-state-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --force --with-deps chromium

      - name: Run monitor
        run: |
          python monitor_tennis.py
